<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Center & Monitoring - DPMPTSP Gunungkidul</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen font-sans text-gray-800">

    <!-- Header Instansi -->
    <header class="bg-blue-900 text-white shadow-md py-5 px-8">
        <div class="max-w-4xl mx-auto flex items-center gap-4">
            <img src="logo-96h.webp"
                 alt="Logo DPMPTSP Kabupaten Gunungkidul"
                 width="348" height="96"
                 class="h-10 w-auto shrink-0">
            <div class="min-w-0">
                <h1 class="text-xl sm:text-2xl font-bold tracking-wide truncate">Data Center & Monitoring Bidang</h1>
                <p class="text-blue-200 text-sm mt-0.5">DPMPTSP Kabupaten Gunungkidul</p>
            </div>
        </div>
    </header>
    <!-- Aksen warna dari logo, sekaligus penanda visual identitas -->
    <div class="h-1 bg-gradient-to-r from-amber-400 via-yellow-400 to-amber-500"></div>

    <!-- Konten Utama -->
    <main class="max-w-4xl mx-auto p-6 mt-6">
        <div class="mb-6">
            <h2 class="text-xl font-semibold text-gray-800">Direktori Bidang</h2>
            <p class="text-gray-500 text-sm">Klik pada salah satu bidang untuk menjelajahi arsip.</p>
        </div>

        <!-- Wadah utama tempat data digambar otomatis -->
        <div class="space-y-4" id="direktori-container"></div>
    </main>

    <footer class="text-center py-8 text-gray-400 text-xs mt-12 border-t border-gray-200">
        &copy; 2026 DPMPTSP Kabupaten Gunungkidul. Internal Monitoring System.
    </footer>

    <!-- Panggil File Data -->
    <script src="data.js"></script>

    <!-- Skrip Interaktif Perakit Tampilan -->
    <script>
        const container = document.getElementById('direktori-container');

        // ==== Ikon inline (SVG kecil, tanpa request tambahan) ====
        const iconChevron = (id) => `
            <svg id="${id}" class="w-4 h-4 shrink-0 text-current transition-transform duration-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
            </svg>`;

        const iconFolder = `
            <svg class="w-5 h-5 shrink-0 text-blue-700" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 7a2 2 0 012-2h3.5l1.5 2H19a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V7z" />
            </svg>`;

        const iconTeam = `
            <svg class="w-4 h-4 shrink-0 text-indigo-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                <path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a4 4 0 00-3-3.87M9 20H4v-2a4 4 0 013-3.87m5-1.13a4 4 0 100-8 4 4 0 000 8zm6 0a4 4 0 10-2-7.46" />
            </svg>`;

        const iconDoc = `
            <svg class="w-4 h-4 shrink-0 opacity-70" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l4.414 4.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
            </svg>`;

        // Wadah accordion dengan animasi CSS murni (grid-rows trick), tanpa JS mengukur tinggi
        function accordionWrapper(id, innerHtml) {
            return `
                <div id="${id}" class="grid grid-rows-[0fr] opacity-0 transition-all duration-300 ease-in-out">
                    <div class="overflow-hidden">
                        ${innerHtml}
                    </div>
                </div>`;
        }

        // Fungsi bantuan untuk merakit HTML Tahunan
        function renderTahunan(daftarTahun, parentId) {
            let html = '';
            daftarTahun.forEach((t) => {
                let htmlSubFolder = t.subFolder.map(sub => `
                    <a href="${sub.link}" target="_blank" rel="noopener"
                       class="flex items-center gap-2 bg-white hover:bg-amber-500 hover:text-white hover:border-amber-500 border border-gray-200 p-2.5 rounded-lg text-sm font-medium shadow-sm transition focus:outline-none focus:ring-2 focus:ring-amber-400">
                       ${iconDoc}
                       <span class="truncate">${sub.nama}</span>
                    </a>
                `).join('');

                const accordionId = `${parentId}-tahun-${t.tahun}`;
                const chevronId = `${accordionId}-chevron`;
                html += `
                    <div class="bg-white border border-gray-200 rounded-xl overflow-hidden shadow-sm mt-2">
                        <button onclick="toggleSub('${accordionId}', '${chevronId}')"
                                class="w-full flex justify-between items-center gap-3 p-3 px-4 text-left font-semibold text-gray-700 hover:bg-amber-50 transition focus:outline-none focus:ring-2 focus:ring-inset focus:ring-amber-400">
                            <span class="flex items-center gap-2 text-sm">
                                <span class="w-1.5 h-1.5 rounded-full bg-amber-400"></span>
                                Tahun ${t.tahun}
                            </span>
                            <span class="flex items-center gap-2 text-gray-400 text-xs">
                                Lihat arsip
                                ${iconChevron(chevronId)}
                            </span>
                        </button>
                        ${accordionWrapper(accordionId, `
                            <div class="p-4 border-t border-gray-100 bg-gray-50/50">
                                <div class="grid grid-cols-2 md:grid-cols-4 gap-2">
                                    ${htmlSubFolder}
                                </div>
                            </div>
                        `)}
                    </div>
                `;
            });
            return html;
        }

        // Merakit elemen utama dari data.js
        function renderDirektori() {
            if (typeof direktoriDinas === 'undefined' || !Array.isArray(direktoriDinas) || direktoriDinas.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-16 bg-white border border-dashed border-gray-300 rounded-xl">
                        <svg class="w-10 h-10 mx-auto text-gray-300 mb-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M9.75 9.75l-2.25 2.25 2.25 2.25m4.5-4.5l2.25 2.25-2.25 2.25M3 12a9 9 0 1018 0 9 9 0 00-18 0z" />
                        </svg>
                        <p class="text-gray-500 text-sm font-medium">Data direktori belum tersedia</p>
                        <p class="text-gray-400 text-xs mt-1">Periksa apakah file data.js sudah dimuat dengan benar.</p>
                    </div>`;
                return;
            }

            let output = '';
            direktoriDinas.forEach((bidang) => {
                let htmlKontenBidang = '';

                if (bidang.timKerja && bidang.timKerja.length > 0) {
                    bidang.timKerja.forEach((tim) => {
                        let isiTahunanTim = renderTahunan(tim.tahunan, tim.id);
                        const timAccId = `${tim.id}-main`;
                        const timChevronId = `${timAccId}-chevron`;
                        htmlKontenBidang += `
                            <div class="bg-slate-50 border border-slate-200 rounded-lg overflow-hidden shadow-sm mt-3">
                                <button onclick="toggleSub('${timAccId}', '${timChevronId}')"
                                        class="w-full flex justify-between items-center p-3 px-4 text-left font-semibold text-indigo-800 hover:bg-indigo-50 transition border-b border-slate-200 focus:outline-none focus:ring-2 focus:ring-inset focus:ring-indigo-400">
                                    <span class="flex items-center gap-2">
                                        ${iconTeam}
                                        ${tim.namaTim}
                                    </span>
                                    ${iconChevron(timChevronId)}
                                </button>
                                ${accordionWrapper(timAccId, `
                                    <div class="p-3 bg-white space-y-2">
                                        ${isiTahunanTim}
                                    </div>
                                `)}
                            </div>
                        `;
                    });
                }
                else if (bidang.tahunan && bidang.tahunan.length > 0) {
                    htmlKontenBidang = renderTahunan(bidang.tahunan, bidang.id);
                }

                const bidangAccId = `${bidang.id}-main`;
                const bidangChevronId = `${bidangAccId}-chevron`;
                output += `
                    <div class="bg-white rounded-xl shadow-md border border-gray-200 overflow-hidden transition hover:shadow-lg">
                        <button onclick="toggleSub('${bidangAccId}', '${bidangChevronId}')"
                                class="w-full flex justify-between items-center gap-4 p-5 text-left hover:bg-blue-50/40 transition focus:outline-none focus:ring-2 focus:ring-inset focus:ring-blue-400">
                            <div class="flex items-start gap-3 min-w-0">
                                <span class="mt-0.5">${iconFolder}</span>
                                <div class="min-w-0">
                                    <h3 class="font-bold text-lg text-gray-800 truncate">${bidang.namaBidang}</h3>
                                    <p class="text-xs text-gray-500 mt-0.5">${bidang.deskripsi}</p>
                                </div>
                            </div>
                            <span class="flex items-center justify-center w-8 h-8 rounded-full bg-blue-100 text-blue-700 shrink-0">
                                ${iconChevron(bidangChevronId)}
                            </span>
                        </button>

                        ${accordionWrapper(bidangAccId, `
                            <div class="p-4 border-t border-gray-100 bg-gray-50">
                                ${htmlKontenBidang}
                            </div>
                        `)}
                    </div>
                `;
            });

            container.innerHTML = output;
        }

        renderDirektori();

        // Fungsi buka-tutup (toggle) dengan animasi halus + rotasi chevron
        function toggleSub(id, chevronId) {
            const el = document.getElementById(id);
            const chevron = chevronId ? document.getElementById(chevronId) : null;
            const isOpen = el.classList.contains('grid-rows-[1fr]');

            if (isOpen) {
                el.classList.remove('grid-rows-[1fr]', 'opacity-100');
                el.classList.add('grid-rows-[0fr]', 'opacity-0');
                if (chevron) chevron.classList.remove('rotate-180');
            } else {
                el.classList.remove('grid-rows-[0fr]', 'opacity-0');
                el.classList.add('grid-rows-[1fr]', 'opacity-100');
                if (chevron) chevron.classList.add('rotate-180');
            }
        }
    </script>
</body>
</html>
