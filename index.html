<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Center & Monitoring - DPMPTSP Gunungkidul</title>
  <!-- Bootstrap 5.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- CSS Kustom Glassmorphism Anda -->
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Sedikit penyesuaian agar wadah card menyesuaikan struktur direktori */
    .main-card {
      max-width: 750px !important;
    }
    .btn-bidang {
      background: linear-gradient(135deg, #FFF6B3, #FFE57F);
      border-radius: 14px;
      padding: 14px 18px;
      font-weight: 600;
      color: #2c2c2c;
      border: none;
      width: 100%;
      text-align: left;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.3s ease;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .btn-bidang:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 16px rgba(255, 229, 127, 0.6);
      color: #2c2c2c;
    }
    .sub-box {
      background: rgba(0, 0, 0, 0.2);
      border-radius: 14px;
      padding: 15px;
      margin-top: 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body class="has-bg">
  <div class="overlay">
    <div class="main-card">
      
      <!-- Logo -->
      <img src="assets/logo.png" alt="Logo DPMPTSP" class="logo">

      <!-- Title -->
      <h5>Data Center & Monitoring Bidang</h5>
      <h4>DPMPTSP Kabupaten Gunungkidul</h4>

      <!-- Daftar Bidang Utama (Akan diisi otomatis oleh data.js) -->
      <div class="links-container" id="direktori-container">
        <!-- Konten dirakit otomatis oleh script di bawah -->
      </div>

      <!-- Footer -->
      <footer>
        <p>Jalan Kesatrian 38 Wonosari, Gunungkidul</p>
        <p>© 2026 DPMPTSP Kabupaten Gunungkidul</p>
      </footer>
    </div>
  </div>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  
  <!-- Panggil File Data Anda -->
  <script src="data.js"></script>

  <!-- Skrip Perakit Otomatis dengan Gaya Tombol Linktree Anda -->
  <script>
    const container = document.getElementById('direktori-container');

    direktoriDinas.forEach((bidang) => {
        let htmlTahunan = '';

        bidang.tahunan.forEach((t) => {
            let htmlSubFolder = t.subFolder.map(sub => `
                <a href="${sub.link}" target="_blank" class="btn-linktree mb-2" style="font-size: 0.9rem; padding: 10px 14px;">
                    <i class="bi bi-folder2-open text-warning"></i>
                    <span>${sub.nama}</span>
                </a>
            `).join('');

            htmlTahunan += `
                <div class="mb-3 text-start">
                    <button class="btn btn-sm btn-outline-light w-100 text-start fw-bold mb-2 py-2 px-3 rounded-3" type="button" data-bs-toggle="collapse" data-bs-target="#${bidang.id}-tahun-${t.tahun}">
                        <i class="bi bi-calendar-event me-2"></i> Tahun ${t.tahun}
                    </button>
                    <div class="collapse ps-2" id="${bidang.id}-tahun-${t.tahun}">
                        <div class="sub-box d-flex flex-column gap-2">
                            ${htmlSubFolder}
                        </div>
                    </div>
                </div>
            `;
        });

        const cardHTML = `
            <div class="w-100 mb-3">
                <button class="btn-bidang" type="button" data-bs-toggle="collapse" data-bs-target="#${bidang.id}-main">
                    <div>
                        <div style="font-size: 1.05rem;" class="fw-bold">${bidang.namaBidang}</div>
                        <div style="font-size: 0.8rem; opacity: 0.8; font-weight: normal;" class="mt-0.5">${bidang.deskripsi}</div>
                    </div>
                    <i class="bi bi-chevron-down fs-5"></i>
                </button>
                
                <div class="collapse" id="${bidang.id}-main">
                    <div class="sub-box mt-2">
                        ${htmlTahunan}
                    </div>
                </div>
            </div>
        `;

        container.innerHTML += cardHTML;
    });
  </script>
</body>
</html>
